<!DOCTYPE html>
<html>
<body>
    <h1>Calorie Tracker</h1>
    <h3>Track a new day?</h3>
    <form method="POST", action="{% url 'index' %}">
        {% csrf_token %} {{ form.as_p }}
        <button type="submit">New Day</button>
    </form>
    <h3>Tracked Days</h3>
    <table>
        <tr><td>Date</td></tr>
        {% for d in dates %}
        <tr>
            <td>{{ d.date }}</td>
            <td>
                <a href="{% url 'manage_meals' d.date %}">Manage Meals</a>
                <a href="{% url 'delete_date' d.date %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
